<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">

    <title>Конструктор рецепта 107-1/у</title>
</head>

<body>
    <h1>Конструктор рецепта</h1>

    <form id="prescription-form">
        <fieldset>
            <legend>Данные рецепта</legend>

            <div>
                <label for="patient_fio">Фамилия и инициалы пациента</label>

                <input
                    type="text"
                    id="patient_fio"
                    name="patient_fio"
                    placeholder="Харитонова У.Я."
                    required
                >
            </div>

            <div>
                <label for="patient_birtdate">Дата рождения пациента</label>

                <input
                    type="text"
                    id="patient_birthdate"
                    name="patient_birtdate"
                    placeholder="ДД.ММ.ГГГГ"
                    required
                >
            </div>

            <div>
                <label for="doctor_fio">ФИО врача</label>

                <input
                    type="text"
                    id="doctor_fio"
                    name="doctor_fio"
                    placeholder="Ложников О.Х."
                    required
                >
            </div>

            <div>
                <label for="drug_1_form_name_dosage">
                    Лекарственная форма, МНН и дозировка
                </label>

                <input
                    type="text"
                    id="drug_1_form_name_dosage"
                    name="drug_1_form_name_dosage"
                    placeholder="Tab. Doxycyclini 0.1 №60"
                    required
                >
            </div>

            <div>
                <label for="drug_1_signa">Способ применения</label>

                <input
                    type="text"
                    id="drug_1_signa"
                    name="drug_1_signa"
                    placeholder="Внутрь по 1 таблетке 2 раза в день 30 дней"
                    required
                >
            </div>
        </fieldset>

        <button type="submit">Сформировать рецепт</button>
    </form>
    
    <aside class="disclaimer-banner" role="note" aria-label="Важное предупреждение">
        <strong>Внимание!!!</strong>
        Сервис формирует только проект рецепта. Перед подписанием и выдачей
        документа врач обязан самостоятельно проверить все сведения и их
        соответствие действующим требованиям.
    </aside>

    <footer class="app-footer">
        <span class="app-footer__version" id="app-version">
            Версия: {{ app_version }}
        </span>

        <span class="app-footer__separator" area-hidden="true">•</span>

        <span class="app-footer__build" id="build-date">
            Сборка: {{ build_date }}
        </span>
        
        <span class="app-footer__separator" area-hidden="true"><br></span>

        <span class="app_footer__copyright" id="app-copyright">
            {{ copyright }}
        </span>
    </footer>

    <script src="form.js"></script>

</body>
</html>
